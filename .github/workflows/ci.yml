name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR cancels its older run. Runs of pushes to main are never
# cancelled: a release needs the run of its own commit to pass (release.yml),
# and a later push must not take that away.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    env:
      CXX: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install build & test deps
        run: |
          # Drop preinstalled third-party apt sources (google-chrome, microsoft):
          # their mirrors intermittently break `apt-get update` (size mismatch
          # "Mirror sync in progress", or 403/"no longer signed" on the azure-cli
          # repo), which has nothing to do with our deps (all from the Ubuntu
          # archive). Match by content, not filename: the offending source lives
          # in different files across runner images (microsoft-prod.list,
          # azure-cli.list, *.sources, ...), so a fixed rm list misses some.
          sudo grep -rlE 'packages\.microsoft\.com|dl\.google\.com' \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ clang python3 python3-numpy python3-pytest git ca-certificates

      - name: Cache FetchContent (googletest)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/_deps
          # Scope the key to the repository: build/_deps holds googletest-subbuild,
          # a CMake scratch tree that bakes in ABSOLUTE paths under
          # /home/runner/work/<repo>/<repo>. Restoring it into a differently named
          # checkout makes CMake refuse to configure ("The current CMakeCache.txt
          # directory ... is different"), which is exactly what the dfkv ->
          # DingoCache rename triggered. github.repository fully determines that
          # path on hosted runners, so keying on it makes the cache rename-proof.
          key: deps-${{ runner.os }}-${{ matrix.compiler }}-${{ github.repository }}-gtest-1.12.1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test (C++ gtests + Python plugin)
        run: ctest --test-dir build --output-on-failure --timeout 300 -j

  arm64-format:
    name: arm64 build & on-disk format tests
    # The CRC-32C instruction path for AArch64 is compiled only here: every
    # other job runs on x86-64. The on-disk format tests check the
    # little-endian encoding and the checksums on that path.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build & test deps
        run: |
          sudo grep -rlE 'packages\.microsoft\.com|dl\.google\.com' \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ git ca-certificates
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j --target crc32c_test lse_format_test
      - name: Test (the hardware CRC path must be the one that ran)
        env:
          DFKV_TEST_EXPECT_CRC32C_HARDWARE: "1"
        run: |
          ./build/crc32c_test
          ./build/lse_format_test

  container-deployment-smoke:
    name: runtime container deployment smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Retries each pinned image, on the canonical registry and then on the
      # mirror, and tags it dfkv-ci/<name>:ci for the checks below.
      - name: Pull observability images
        run: bash .github/scripts/pull_observability_images.sh
      - name: Validate deployment and alert configuration
        env:
          DFKV_GRAFANA_ADMIN_PASSWORD: ci-validation-only
        run: |
          docker compose -f deploy/observability/docker-compose.yml config -q
          docker run --rm \
            -v "$PWD/deploy/observability:/etc/prometheus:ro" \
            --entrypoint promtool \
            dfkv-ci/prometheus:ci \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/deploy/observability:/etc/prometheus:ro" \
            --entrypoint promtool \
            dfkv-ci/prometheus:ci \
            test rules /etc/prometheus/alerts_test.yml
          docker run --rm \
            -v "$PWD/deploy/observability:/etc/dfkv-observability:ro" \
            dfkv-ci/otel-collector:ci \
            validate --config=/etc/dfkv-observability/otel-collector-config.yaml
          docker run --rm \
            -v "$PWD/deploy/observability:/etc/dfkv-observability:ro" \
            --entrypoint /tempo \
            dfkv-ci/tempo:ci \
            -config.file=/etc/dfkv-observability/tempo.yaml -config.verify=true
      - name: Build the shipped runtime image
        run: docker build --target runtime -t dfkv-runtime-smoke --build-arg UBUNTU_MIRROR=http://azure.archive.ubuntu.com/ubuntu .
      - name: Launch and exercise the deployed data path
        run: |
          set -eu
          id=$(docker run -d --entrypoint dfkv_server dfkv-runtime-smoke \
            --dir /tmp/dfkv-data --port 12000 --cap 67108864 \
            --store-engine file)
          trap 'docker logs "$id"; docker rm -f "$id" >/dev/null' EXIT
          ready=0
          for _ in $(seq 1 100); do
            if docker exec "$id" dfkvctl stat 127.0.0.1:12000 \
                 | grep -q 'dfkv_server_ready 1'; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" = 1
          docker exec "$id" dfkv_smoke \
            --members n=127.0.0.1:12000 --size 4096
          docker exec "$id" dfkvctl \
            --members n=127.0.0.1:12000 --namespace ci/container \
            put deployment-smoke payload
          test "$(docker exec "$id" dfkvctl \
            --members n=127.0.0.1:12000 --namespace ci/container \
            get deployment-smoke)" = payload

  thread-sanitizer:
    name: ThreadSanitizer (race detection)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install deps
        run: |
          # Drop preinstalled third-party apt sources (google-chrome, microsoft):
          # their mirrors intermittently break `apt-get update` (size mismatch
          # "Mirror sync in progress", or 403/"no longer signed" on the azure-cli
          # repo), which has nothing to do with our deps (all from the Ubuntu
          # archive). Match by content, not filename: the offending source lives
          # in different files across runner images (microsoft-prod.list,
          # azure-cli.list, *.sources, ...), so a fixed rm list misses some.
          sudo grep -rlE 'packages\.microsoft\.com|dl\.google\.com' \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ git ca-certificates \
            python3 python3-numpy python3-pytest
      - name: Build with TSan
        run: |
          cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread \
            -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread
          cmake --build build-tsan -j
      - name: Run C++ suites under TSan (python excluded — ctypes dlopen)
        run: TSAN_OPTIONS=halt_on_error=1:allocator_may_return_null=1 ctest --test-dir build-tsan -E 'python_plugin|python_hicache_device_direct' --output-on-failure --timeout 300

  etcd-mds:
    name: MDS and membership against a real etcd
    # The MDS, registrar, poller and client discovery tests skip themselves
    # without DFKV_TEST_ETCD, so every other job leaves them out. Here they run
    # against an etcd of the version deployments use, and a skip for want of
    # etcd fails the job.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ETCD_VERSION: v3.5.17
      ETCD_SHA256: eff6ac621d41711085d0f38fab17d8fa3705f6326c3ff11301a1f5a71fc94edd
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install deps
        run: |
          sudo grep -rlE 'packages\.microsoft\.com|dl\.google\.com' \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ git ca-certificates curl python3
      - name: Install and start etcd
        run: |
          set -eu
          archive="etcd-${ETCD_VERSION}-linux-amd64.tar.gz"
          curl -fsSL --retry 5 -o "$archive" \
            "https://github.com/etcd-io/etcd/releases/download/${ETCD_VERSION}/${archive}"
          echo "${ETCD_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive"
          mkdir -p "$RUNNER_TEMP/etcd-data"
          "./etcd-${ETCD_VERSION}-linux-amd64/etcd" --data-dir "$RUNNER_TEMP/etcd-data" \
            --listen-client-urls http://127.0.0.1:2379 \
            --advertise-client-urls http://127.0.0.1:2379 > "$RUNNER_TEMP/etcd.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fs -m 1 http://127.0.0.1:2379/health | grep -q '"health":"true"' && exit 0
            sleep 0.5
          done
          cat "$RUNNER_TEMP/etcd.log"
          exit 1
      - name: Build the etcd-backed tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j --target etcd_client_test mds_server_test \
            mds_dual_proto_test mds_member_poller_test mds_registrar_test \
            kv_client_mds_test dfkv_server dfkv_mds
      - name: Run them (a skip for want of etcd fails)
        env:
          DFKV_TEST_ETCD: 127.0.0.1:2379
        run: |
          set -eu
          for t in etcd_client_test mds_server_test mds_dual_proto_test \
                   mds_member_poller_test mds_registrar_test kv_client_mds_test; do
            (cd build && "./$t" --gtest_output="xml:$t.xml")
          done
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as E
          ran = 0
          for path in sorted(glob.glob("build/*_test.xml")):
              root = E.parse(path).getroot()
              ran += int(root.attrib["tests"])
              for case in root.iter("testcase"):
                  for skipped in case.iter("skipped"):
                      text = (skipped.get("message") or "") + (skipped.text or "")
                      assert "DFKV_TEST_ETCD" not in text, (path, case.get("name"), text)
              assert not list(root.iter("failure")), path
          assert ran > 0
          print("etcd-backed tests run:", ran)
          PY
      - name: etcd log
        if: failure()
        run: tail -100 "$RUNNER_TEMP/etcd.log"

  address-sanitizer:
    name: AddressSanitizer + UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install deps
        run: |
          sudo grep -rlE 'packages\.microsoft\.com|dl\.google\.com' \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ git ca-certificates \
            python3 python3-numpy python3-pytest
      - name: Build with ASan and UBSan
        run: |
          # RelWithDebInfo with its flags replaced: -O1, and no -DNDEBUG, so
          # every assert() is checked too.
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O1 -g" \
            -DDFKV_HARDENING=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan -j
      # Excluded as under TSan: the two tests that load libdfkv.so into Python
      # through ctypes, without the sanitizer runtime. Leak checking is off:
      # the gate is memory errors and undefined behaviour. The three
      # descriptor-exhaustion tests run the process out of file descriptors;
      # UBSan's vptr check (-fsanitize=vptr) then cannot inspect the object
      # ("memory cannot be printed") and reports "member call on address ...
      # which does not point to an object of type '_State'" on a std::thread
      # start in the server. Checked once with -fno-sanitize=vptr: they pass.
      # vptr stays on for everything else, and they run in every other job.
      - name: Run the suites under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:allocator_may_return_null=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan -E '^(python_plugin|python_hicache_device_direct|.*\.DescriptorExhaustionBacksOffAndRecovers)$' --output-on-failure --timeout 300 -j

  rdma-compile:
    name: RDMA build (compile-check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install deps incl. RDMA dev
        run: |
          # Drop preinstalled third-party apt sources (google-chrome, microsoft):
          # their mirrors intermittently break `apt-get update` (size mismatch
          # "Mirror sync in progress", or 403/"no longer signed" on the azure-cli
          # repo), which has nothing to do with our deps (all from the Ubuntu
          # archive). Match by content, not filename: the offending source lives
          # in different files across runner images (microsoft-prod.list,
          # azure-cli.list, *.sources, ...), so a fixed rm list misses some.
          sudo grep -rlE 'packages\.microsoft\.com|dl\.google\.com' \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ git ca-certificates libibverbs-dev
      - name: Configure + build with DFKV_WITH_RDMA=ON (no device at runtime)
        run: |
          cmake -S . -B build-rdma -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DDFKV_WITH_RDMA=ON -DDFKV_BUILD_TESTS=OFF
          cmake --build build-rdma -j
      - name: Verify ibverbs linked
        run: ldd build-rdma/dfkv_server | grep ibverbs

  rdma-loopback:
    name: RDMA datapath (Soft-RoCE loopback + TSan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The loopback tests allowed to skip, each set with its reason. Any other
    # skip fails the step: a skip that spreads (a broken device check, a new
    # blanket skip) must not pass as green again.
    env:
      # Soft-RoCE: a SEND to a destroyed peer QP never fails with RETRY_EXC.
      SKIP_RXE: >-
        RdmaBatchGet.AStalePooledConnectionIsRetriedOnce
        RdmaLoopback.RealFifoQueuedConnectionCloseSync
        RdmaLoopback.RealFifoQueuedConnectionCloseUring
        RdmaLoopback.FreshConnectionFailingAfterAStaleOneCoolsThePeerRail
        RdmaLoopback.ClientFailedCompletionNamesPeerDeviceOperationAndStatus
      # They need two RDMA devices (DFKV_RDMA_DEV with two rails).
      SKIP_TWO_RAILS: >-
        RdmaLoopback.BootstrapRefusedForOneDeviceIsRetriedOnAnotherRail
        RdmaLoopback.DescriptorExhaustionUsesAnIdleConnectionOnAnotherRail
        RdmaLoopback.DialWithoutDescriptorsUsesAnIdleConnectionOnAnotherRail
        RdmaLoopback.EndpointOutOfMemoryOnOneRailIsServedOnAnother
        RdmaLoopback.PostSubmitPutFailureCoolsActualRemoteRailWithoutReplay
        RdmaLoopback.RemoteCooldownBypassesIdlePoolAndUsesSiblingRail
        RdmaLoopback.ReplaySafeEndpointRetryExcludesRailButPostedPutNeverReplays
        RdmaLoopback.SingleEnabledRailFallbackIsNotCrossRailRetry
        RdmaPeerRailDown.AFullPeerIsNotTakenForARefusal
        RdmaPeerRailDown.AnMdsNamedPeersBrokenRailIsAvoidedAfterItFails
        RdmaPeerRailDown.ARefusalNeverCoolsAPeersLastRail
        RdmaPeerRailDown.AStaticPeersBrokenRailIsAvoidedAfterItFails
        RdmaPortState.ARailWhosePortGoesDownLeavesSelectionAndComesBack
        RdmaRailAdmission.ACooledRailIsProbedInTheBackground
        RdmaRailAdmission.ARailsLatencyExcludesConnectionSetup
        RdmaRailSuspect.MdsNamedPeerFailureChoosesSibling
        RdmaRailSuspect.RegistrationAfterSuspectWakeCannotStayLive
        RdmaRailSuspect.StaticPeerFailureChoosesSibling
        RdmaRailSuspect.UnnamedBootstrapFailsClosedUntilOneRailExpires
        RdmaRegisterMemory.AFailedRailUndoesTheOthersAndPublishesNothing
        RdmaServerPorts.ARailGoingDownEndsOnlyItsConnections
        RdmaServerPorts.NoDeviceNamedGetsTheFirstActiveRail
        RdmaVerbs.PoolRegistrationDoesNotStallOtherRails
      # No GPU on the runner; the helper child runs only when spawned.
      SKIP_OTHER: >-
        RdmaLoopback.MultiSegmentGetPublishesUnequalExactBytesToGuardedCudaDestinations
        RdmaLoopback.PinnedBouncePoolChunksAndBackpressuresConcurrentCudaPublications
        RdmaLoopback.PinnedBouncePoolQuarantinesSlotAfterEnqueueAndRecoverySyncErrors
        RdmaLoopbackChild.HoldsAGrantUntilKilled
      # Opt-in benchmarks: each runs only when its DFKV_*_BENCH is set.
      SKIP_OPT_IN: >-
        RdmaMrCost.ReadRegistrationPerGetBench
        RdmaSession.FirstOperationAfterReclaimBench
        RdmaVerbs.EndpointSetupBench
      # ThreadSanitizer: a forked child of a threaded process cannot start
      # threads.
      SKIP_TSAN_FORK: >-
        RdmaLoopback.EndpointOpenWithoutDescriptorsIsALocalFailure
        RdmaLoopback.DescriptorExhaustionUsesAnIdleConnectionOnAnotherRail
        RdmaLoopback.DialWithoutDescriptorsUsesAnIdleConnectionOnAnotherRail
        RdmaBootstrapListener.DescriptorExhaustionBacksOffAndRecovers
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install deps incl. RDMA dev + tools
        run: |
          # Drop preinstalled third-party apt sources (google-chrome, microsoft):
          # their mirrors intermittently break `apt-get update` (size mismatch
          # "Mirror sync in progress", or 403/"no longer signed" on the azure-cli
          # repo), which has nothing to do with our deps (all from the Ubuntu
          # archive). Match by content, not filename: the offending source lives
          # in different files across runner images (microsoft-prod.list,
          # azure-cli.list, *.sources, ...), so a fixed rm list misses some.
          sudo grep -rlE 'packages\.microsoft\.com|dl\.google\.com' \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ git ca-certificates \
            libibverbs-dev liburing-dev rdma-core iproute2
      - name: Set up Soft-RoCE (rdma_rxe) over loopback
        run: |
          # rxe over 'lo' keeps packets in-host, so RC self-loopback actually
          # works in CI (rxe over a physical NIC relies on the network hairpinning
          # packets back, which GitHub runners don't do).
          # Runners have the RDMA side of their NIC (a ConnectX VF, mlx5_0,
          # or a MANA NIC, manae_0), which cannot be opened (its GID query
          # fails) and which discovery picks first. Its RDMA driver goes; the
          # NIC's Ethernet (mlx5_core, mana) stays. Only rxe devices may be
          # left: the tests discover devices.
          # The NIC's VF can be hot-plugged again later in the run (seen: a
          # new rdmaP... device ten minutes in), which would load the driver
          # again: it is kept from loading at all.
          printf 'install mlx5_ib /bin/false\ninstall mana_ib /bin/false\n' \
            | sudo tee /etc/modprobe.d/dfkv-ci-no-hca-rdma.conf
          sudo modprobe -r mlx5_ib mana_ib || true
          sudo modprobe rdma_rxe || true
          sudo rdma link add rxe0 type rxe netdev lo || true
          # A second device for the tests that need two rails: rxe1 on a dummy
          # netdev with an address of its own. Rails pair by device name, so
          # each device only has to loop back to itself.
          sudo ip link add dfkvrail1 type dummy || true
          sudo ip addr add 10.213.0.1/24 dev dfkvrail1 || true
          sudo ip link set dfkvrail1 up || true
          sudo rdma link add rxe1 type rxe netdev dfkvrail1 || true
          rdma link show || true
          others=$(ls /sys/class/infiniband | grep -v '^rxe' || true)
          if [ -n "$others" ]; then
            echo "::error::RDMA devices other than rxe remain: $others"
            exit 1
          fi
      - name: Build (RDMA + tests)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDFKV_WITH_RDMA=ON -DDFKV_WITH_URING=ON
          cmake --build build -j --target rdma_loopback_test rdma_lease_loopback_test rdma_lease_client_test
      # Probe first: check that rxe can round-trip RC traffic with the simplest
      # datapath case, then run the full suite. A probe failure fails the job;
      # tolerating it let the RDMA tests be skipped on every run while the job
      # stayed green (the runners' mlx5_0 was picked and could not open, and
      # memory registration was over the memlock limit).
      - name: Probe rxe loopback connectivity
        id: rxe_probe
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          test "$(ulimit -l)" = unlimited
          others=$(ls /sys/class/infiniband | grep -v '^rxe' || true)
          test -z "$others" || { echo "::error::RDMA devices other than rxe: $others"; exit 1; }
          if ./build/rdma_loopback_test --gtest_filter=RdmaLoopback.PutGetExistMissOverRdma --gtest_output=xml:rdma-probe.xml \
             && python3 -c 'import xml.etree.ElementTree as E; r=E.parse("rdma-probe.xml").getroot(); assert int(r.attrib["tests"]) == 1 and not list(r.iter("skipped")) and not list(r.iter("failure"))'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::RDMA NOT EXERCISED: the rxe loopback probe failed"
            exit 1
          fi
      - name: Probe the second rxe device
        id: rxe1_probe
        if: steps.rxe_probe.outputs.ok == 'true'
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          test "$(ulimit -l)" = unlimited
          others=$(ls /sys/class/infiniband | grep -v '^rxe' || true)
          test -z "$others" || { echo "::error::RDMA devices other than rxe: $others"; exit 1; }
          if DFKV_RDMA_DEV=rxe1 ./build/rdma_loopback_test --gtest_filter=RdmaLoopback.PutGetExistMissOverRdma --gtest_output=xml:rdma-probe-rxe1.xml \
             && python3 -c 'import xml.etree.ElementTree as E; r=E.parse("rdma-probe-rxe1.xml").getroot(); assert int(r.attrib["tests"]) == 1 and not list(r.iter("skipped")) and not list(r.iter("failure"))'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::TWO-RAIL RDMA TESTS NOT EXERCISED: rxe1 (dummy netdev) did not pass the loopback probe"
            exit 1
          fi
      - name: Run RDMA datapath test (hard gate when rxe works)
        if: steps.rxe_probe.outputs.ok == 'true'
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          test "$(ulimit -l)" = unlimited
          others=$(ls /sys/class/infiniband | grep -v '^rxe' || true)
          test -z "$others" || { echo "::error::RDMA devices other than rxe: $others"; exit 1; }
          ./build/rdma_loopback_test --gtest_output=xml:loopback.xml
          python3 .github/scripts/check_skips.py loopback.xml SKIP_RXE SKIP_TWO_RAILS SKIP_OTHER SKIP_OPT_IN
          DFKV_SERVER_URING=0 ./build/rdma_lease_loopback_test --gtest_output=xml:lease-sync.xml
          DFKV_SERVER_URING=1 ./build/rdma_lease_loopback_test --gtest_output=xml:lease-uring.xml
          ./build/rdma_lease_client_test --gtest_output=xml:lease-client.xml
          python3 -c 'import xml.etree.ElementTree as E; roots=[E.parse(p).getroot() for p in ("lease-sync.xml","lease-uring.xml","lease-client.xml")]; assert all(int(r.attrib["tests"]) > 0 and not list(r.iter("skipped")) and not list(r.iter("failure")) for r in roots)'
      # The loopback tests that skipped on one device (they need two rails),
      # again with DFKV_RDMA_DEV=rxe0,rxe1. Tests that still skip (GPU,
      # opt-in benchmarks) are listed; a two-rail test that skips fails.
      - name: Run the two-rail RDMA tests (hard gate when rxe1 works)
        if: steps.rxe_probe.outputs.ok == 'true' && steps.rxe1_probe.outputs.ok == 'true'
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          test "$(ulimit -l)" = unlimited
          others=$(ls /sys/class/infiniband | grep -v '^rxe' || true)
          test -z "$others" || { echo "::error::RDMA devices other than rxe: $others"; exit 1; }
          filter=$(python3 -c 'import xml.etree.ElementTree as E; r=E.parse("loopback.xml").getroot(); print(":".join(c.attrib["classname"]+"."+c.attrib["name"] for c in r.iter("testcase") if list(c.iter("skipped"))))')
          test -n "$filter"
          DFKV_RDMA_DEV=rxe0,rxe1 ./build/rdma_loopback_test --gtest_filter="$filter" --gtest_output=xml:loopback-two-rails.xml
          # With two rails none of the two-rail tests may skip.
          python3 .github/scripts/check_skips.py loopback-two-rails.xml SKIP_RXE SKIP_OTHER SKIP_OPT_IN
      - name: Exercise RDMA through the shipped runtime image
        if: steps.rxe_probe.outputs.ok == 'true'
        run: |
          set -eu
          docker build --target runtime -t dfkv-runtime-rdma --build-arg UBUNTU_MIRROR=http://azure.archive.ubuntu.com/ubuntu .
          id=$(docker run -d --privileged --network host \
            --ulimit memlock=-1:-1 -e DFKV_RDMA_DEV=rxe0 \
            dfkv-runtime-rdma --dir /tmp/dfkv-data \
            --port 12000 --rdma-port 12001 \
            --metrics-port 12010 --metrics-bind 127.0.0.1 \
            --cap 67108864 --store-engine file)
          trap 'docker logs "$id"; docker rm -f "$id" >/dev/null' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec "$id" dfkvctl stat 127.0.0.1:12000 \
                 | grep -q 'dfkv_server_ready 1'; then
              ready=1
              break
            fi
            test "$(docker inspect -f '{{.State.Running}}' "$id")" = true
            sleep 1
          done
          test "$ready" = 1
          docker exec -e DFKV_RDMA=1 -e DFKV_RDMA_DEV=rxe0 "$id" \
            dfkv_smoke --members n=127.0.0.1:12001 --size 1048576
      - name: Build + run RDMA datapath test under ThreadSanitizer (hard gate when rxe works)
        if: steps.rxe_probe.outputs.ok == 'true'
        run: |
          cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DDFKV_WITH_RDMA=ON -DDFKV_WITH_URING=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread \
            -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread
          cmake --build build-tsan -j --target rdma_loopback_test rdma_lease_loopback_test rdma_lease_client_test
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          test "$(ulimit -l)" = unlimited
          others=$(ls /sys/class/infiniband | grep -v '^rxe' || true)
          test -z "$others" || { echo "::error::RDMA devices other than rxe: $others"; exit 1; }
          TSAN_OPTIONS=halt_on_error=1 ./build-tsan/rdma_loopback_test --gtest_output=xml:loopback-tsan.xml
          python3 .github/scripts/check_skips.py loopback-tsan.xml SKIP_RXE SKIP_TWO_RAILS SKIP_OTHER SKIP_OPT_IN SKIP_TSAN_FORK
          TSAN_OPTIONS=halt_on_error=1 DFKV_SERVER_URING=0 ./build-tsan/rdma_lease_loopback_test --gtest_output=xml:lease-sync-tsan.xml
          TSAN_OPTIONS=halt_on_error=1 DFKV_SERVER_URING=1 ./build-tsan/rdma_lease_loopback_test --gtest_output=xml:lease-uring-tsan.xml
          TSAN_OPTIONS=halt_on_error=1 ./build-tsan/rdma_lease_client_test --gtest_output=xml:lease-client-tsan.xml
          python3 -c 'import xml.etree.ElementTree as E; roots=[E.parse(p).getroot() for p in ("lease-sync-tsan.xml","lease-uring-tsan.xml","lease-client-tsan.xml")]; assert all(int(r.attrib["tests"]) > 0 and not list(r.iter("skipped")) and not list(r.iter("failure")) for r in roots)'

  portable-static-build:
    name: portable static artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Build inside ubuntu:22.04 (glibc 2.35) so the dynamically-linked artifacts
    # have a low glibc floor. The release needs no symbol newer than 2.34, so
    # it runs on glibc 2.34 hosts too (RHEL 9 family); the check below fails a
    # build that needs 2.35 or later. Building on
    # the runner's ubuntu-latest (glibc 2.39) bakes in GLIBC_2.3x symbols that
    # FAIL on older deploy nodes. RDMA-enabled + static libstdc++/libgcc;
    # libibverbs stays dynamic (it dlopen()s provider drivers at runtime).
    container: docker.io/library/ubuntu@sha256:3b06811b2afd352be909dd088a004166d665dc76d38b13eada33522a9d915c6f # 22.04
    steps:
      # Bare container: install the toolchain (incl. git, for checkout) first.
      - name: Install build deps
        run: |
          # The bare container defaults to archive.ubuntu.com, which is
          # intermittently slow/unreachable from GitHub runners; use the
          # in-region Azure mirror the runner hosts already use. security.ubuntu.com
          # stays upstream: the mirror's -security pocket lags (index ahead of pool -> 404).
          sed -i -E 's#https?://archive\.ubuntu\.com/ubuntu/?#http://azure.archive.ubuntu.com/ubuntu/#' /etc/apt/sources.list
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            cmake ninja-build g++ binutils git ca-certificates libibverbs-dev \
            liburing-dev python3 python3-pip python3-numpy xz-utils tar
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # -g: the packager moves the debug information into the separate debug
      # archive and strips the shipped binaries.
      - name: Build portable RDMA artifacts (static libstdc++, no tests)
        run: |
          cmake -S . -B build-static -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS=-g \
            -DDFKV_BUILD_TESTS=OFF -DDFKV_WITH_RDMA=ON -DDFKV_WITH_URING=ON \
            -DDFKV_STATIC_LIBSTDCXX=ON
          cmake --build build-static -j
      - name: Verify hardening (canaries, fortified calls, full RELRO)
        run: bash .github/scripts/check_hardening.sh build-static/dfkv_server build-static/dfkv_mds build-static/libdfkv.so
      # The glibc floor is checked below on every packaged binary.
      - name: Verify portability (RDMA linked + static libstdc++)
        run: |
          echo "== libdfkv.so deps (expect libibverbs, NOT libstdc++) =="
          ldd build-static/libdfkv.so
          if ldd build-static/libdfkv.so | grep -q 'libstdc++'; then
            echo 'ERROR: libstdc++ is not statically linked'; exit 1; fi
      - name: Install, package, and verify exact release payload
        run: |
          set -eu
          V=$(cat VERSION)
          PKG="dfkv-${V}-linux-x86_64"

          # Exercise the supported system-prefix manifest independently.
          cmake --install build-static --prefix "$PWD/install-check/$PKG"

          # The canonical packager flattens share/dfkv into a self-contained
          # portable repository layout while preserving bin/lib/include.
          mkdir -p release unpack
          deploy/package_release.sh build-static release
          tar xzf "release/${PKG}.tar.gz" -C unpack
          ! tar -tzf "release/${PKG}.tar.gz" | grep -E '(__pycache__|\.py[co]$)'
          ROOT="$PWD/unpack/$PKG"
          # glibc floor 2.34, over everything the release ships.
          bash .github/scripts/check_glibc_floor.sh "$ROOT"/bin/* "$ROOT"/lib/libdfkv.so.*.*

          for binary in dfkv_server dfkv_mds dfkv_bench dfkv_smoke dfkvctl \
                        dfkv_discover_smoke dfkv_gpu_dedup_repro; do
            test -x "$ROOT/bin/$binary"
            "$ROOT/bin/$binary" --version
          done
          test -f "$ROOT/lib/libdfkv.so"
          test -L "$ROOT/lib/libdfkv.so"
          test -L "$ROOT/lib/libdfkv.so.${V%%.*}"
          test "$(readlink "$ROOT/lib/libdfkv.so")" = "libdfkv.so.${V%%.*}"
          test "$(readlink "$ROOT/lib/libdfkv.so.${V%%.*}")" = "libdfkv.so.$V"
          test -f "$ROOT/python/dfkv_hicache.py"
          test -f "$ROOT/python/dfkv_common/client_metrics.py"
          test -f "$ROOT/python/dfkv_telemetry/metrics_push.py"
          test -f "$ROOT/deploy/dfkv_load_regression.py"
          test -f "$ROOT/deploy/dfkv_membership_audit.py"
          test -f "$ROOT/deploy/observability/docker-compose.yml"
          test -f "$ROOT/deploy/observability/alerts.yml"
          test -f "$ROOT/docs/METRICS.md"
          test -f "$ROOT/src/cache/dfkv_server_main.cc"
          test -f "$ROOT/integration/common/pyproject.toml"
          test -f "$ROOT/test/python/test_dfkv_operational_tools.py"
          test -f "$ROOT/Makefile"
          test -f "$ROOT/Dockerfile"
          test -f "$ROOT/.dockerignore"
          test -f "$ROOT/.github/workflows/ci.yml"
          test -f "$ROOT/.github/workflows/release.yml"

          PYTHONPYCACHEPREFIX="$PWD/pycache" python3 -m compileall -q \
            "$ROOT/python" "$ROOT/deploy" "$ROOT/integration"
          PYTHONPYCACHEPREFIX="$PWD/pycache" PYTHONPATH="$ROOT/python:$ROOT/test/python" python3 - <<'PY'
          import dfkv_common
          import dfkv_hicache
          import dfkv_hot_config
          import dfkv_metrics
          import dfkv_telemetry
          PY

          # Debug symbols: a separate archive, one .debug file per shipped
          # binary, each the one its stripped binary's debuglink names.
          mkdir -p unpack-debug
          tar xzf "release/${PKG}-debug.tar.gz" -C unpack-debug
          for binary in "$ROOT"/bin/* "$ROOT"/lib/libdfkv.so.*.*; do
            relative=${binary#"$ROOT/"}
            debug="unpack-debug/$PKG/$relative.debug"
            test -f "$debug"
            readelf -S "$debug" 2>/dev/null | grep -q '\.debug_info'
            ! readelf -S "$binary" | grep -q '\.debug_info'
            readelf --string-dump=.gnu_debuglink "$binary" \
              | grep -qF "$(basename "$relative").debug"
          done
          du -b "release/${PKG}.tar.gz" "release/${PKG}-debug.tar.gz"

          cp "release/${PKG}.tar.gz" "release/${PKG}-debug.tar.gz" .
          sha256sum "${PKG}.tar.gz" | tee "${PKG}.tar.gz.sha256"
          sha256sum "${PKG}-debug.tar.gz" | tee "${PKG}-debug.tar.gz.sha256"
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dfkv-linux-x86_64
          path: |
            dfkv-*-linux-x86_64.tar.gz
            dfkv-*-linux-x86_64.tar.gz.sha256
            dfkv-*-linux-x86_64-debug.tar.gz
            dfkv-*-linux-x86_64-debug.tar.gz.sha256


  python-wheels:
    name: connector wheels
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build and verify connector wheels
        run: |
          set -eu
          V=$(cat VERSION)
          mkdir -p wheels
          python -m pip wheel --no-deps --wheel-dir wheels integration/common
          python -m pip wheel --no-deps --wheel-dir wheels integration/lmcache
          python -m pip wheel --no-deps --wheel-dir wheels integration/vllm
          test -f "wheels/dfkv_common-${V}-py3-none-any.whl"
          test -f "wheels/dfkv_connector-${V}-py3-none-any.whl"
          test -f "wheels/dfkv_vllm-${V}-py3-none-any.whl"
          python -m pip install --no-deps --target wheel-check wheels/*.whl
          PYTHONPATH=wheel-check python - <<'PY'
          from importlib import metadata
          expected = {
              "dfkv-common": "dfkv_common/client_metrics.py",
              "dfkv-connector": "dfkv_connector/_telemetry/metrics_push.py",
              "dfkv-vllm": "dfkv_vllm/_telemetry/metrics_push.py",
          }
          version = open("VERSION", encoding="utf-8").read().strip()
          for distribution, required_file in expected.items():
              assert metadata.version(distribution) == version
              packaged = {str(path) for path in metadata.files(distribution) or ()}
              assert required_file in packaged, (distribution, required_file)
          import dfkv_common
          import dfkv_vllm
          import dfkv_vllm._telemetry.metrics_push
          PY
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dfkv-connector-wheels
          path: wheels/*.whl

  vllm-connector-tests:
    name: vLLM connector tests (CPU, ${{ matrix.vllm.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        vllm:
          # Preserve the legacy policy-typed-spec contract and deliberately
          # advance the manager-owned KV-cache API pin with connector changes.
          - name: legacy
            commit: 08aa305fb5c56d66566f98f55d51a39b43af936f
          - name: manager-api
            commit: e7f220fdfaf71bb85d8c4bb833070101e9a6ced6
    env:
      VLLM_COMMIT: ${{ matrix.vllm.commit }}
      TORCH_VERSION: 2.14.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: vllm-project/vllm
          ref: ${{ env.VLLM_COMMIT }}
          path: vllm-src
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vllm-src/requirements/common.txt
      - name: Install CPU torch and vLLM Python dependencies
        run: |
          set -eu
          python -m pip install "torch==${TORCH_VERSION}" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r vllm-src/requirements/common.txt pytest
          python -m pip install --no-deps -e integration/common
      - name: Run connector tests
        # The scheduler, block pool and KV cache managers exercised here are
        # pure Python, so vLLM runs from source without building its kernels.
        # CUDA/RDMA/server-dependent tests skip themselves.
        env:
          PYTHONPATH: ${{ github.workspace }}/vllm-src:${{ github.workspace }}/integration/vllm/src
        run: python -m pytest -q -p no:cacheprovider -rs integration/vllm/tests
