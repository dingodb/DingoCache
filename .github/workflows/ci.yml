name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    env:
      CXX: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install build & test deps
        run: |
          # Drop preinstalled third-party apt sources (google-chrome, microsoft):
          # their mirrors intermittently break `apt-get update` (size mismatch
          # "Mirror sync in progress", or 403/"no longer signed" on the azure-cli
          # repo), which has nothing to do with our deps (all from the Ubuntu
          # archive). Match by content, not filename: the offending source lives
          # in different files across runner images (microsoft-prod.list,
          # azure-cli.list, *.sources, ...), so a fixed rm list misses some.
          sudo grep -rlE 'packages\.microsoft\.com|dl\.google\.com' \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ clang python3 python3-numpy git ca-certificates

      - name: Cache FetchContent (googletest)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/_deps
          # Scope the key to the repository: build/_deps holds googletest-subbuild,
          # a CMake scratch tree that bakes in ABSOLUTE paths under
          # /home/runner/work/<repo>/<repo>. Restoring it into a differently named
          # checkout makes CMake refuse to configure ("The current CMakeCache.txt
          # directory ... is different"), which is exactly what the dfkv ->
          # DingoCache rename triggered. github.repository fully determines that
          # path on hosted runners, so keying on it makes the cache rename-proof.
          key: deps-${{ runner.os }}-${{ matrix.compiler }}-${{ github.repository }}-gtest-1.12.1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test (C++ gtests + Python plugin)
        run: ctest --test-dir build --output-on-failure -j

  container-deployment-smoke:
    name: runtime container deployment smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate deployment and alert configuration
        env:
          DFKV_GRAFANA_ADMIN_PASSWORD: ci-validation-only
        run: |
          docker compose -f deploy/observability/docker-compose.yml config -q
          docker run --rm \
            -v "$PWD/deploy/observability:/etc/prometheus:ro" \
            --entrypoint promtool \
            docker.m.daocloud.io/prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/deploy/observability:/etc/dfkv-observability:ro" \
            docker.m.daocloud.io/otel/opentelemetry-collector-contrib@sha256:c5918f78992ee73b0d6f0e599423ac5ec52dd5d9726733114d6eca53d5a32ed5 \
            validate --config=/etc/dfkv-observability/otel-collector-config.yaml
          docker run --rm \
            -v "$PWD/deploy/observability:/etc/dfkv-observability:ro" \
            --entrypoint /tempo \
            docker.m.daocloud.io/grafana/tempo@sha256:cda87c212d8c584dc0b89e337e7ed648a5100feb657e5d528480ee4fa03dbbe3 \
            -config.file=/etc/dfkv-observability/tempo.yaml -config.verify=true
      - name: Build the shipped runtime image
        run: docker build --target runtime -t dfkv-runtime-smoke .
      - name: Launch and exercise the deployed data path
        run: |
          set -eu
          id=$(docker run -d --entrypoint dfkv_server dfkv-runtime-smoke \
            --dir /tmp/dfkv-data --port 12000 --cap 67108864 \
            --store-engine file)
          trap 'docker logs "$id"; docker rm -f "$id" >/dev/null' EXIT
          ready=0
          for _ in $(seq 1 100); do
            if docker exec "$id" dfkvctl stat 127.0.0.1:12000 \
                 | grep -q 'dfkv_server_ready 1'; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" = 1
          docker exec "$id" dfkv_smoke \
            --members n=127.0.0.1:12000 --size 4096
          docker exec "$id" dfkvctl \
            --members n=127.0.0.1:12000 --namespace ci/container \
            put deployment-smoke payload
          test "$(docker exec "$id" dfkvctl \
            --members n=127.0.0.1:12000 --namespace ci/container \
            get deployment-smoke)" = payload

  thread-sanitizer:
    name: ThreadSanitizer (race detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install deps
        run: |
          # Drop preinstalled third-party apt sources (google-chrome, microsoft):
          # their mirrors intermittently break `apt-get update` (size mismatch
          # "Mirror sync in progress", or 403/"no longer signed" on the azure-cli
          # repo), which has nothing to do with our deps (all from the Ubuntu
          # archive). Match by content, not filename: the offending source lives
          # in different files across runner images (microsoft-prod.list,
          # azure-cli.list, *.sources, ...), so a fixed rm list misses some.
          sudo grep -rlE 'packages\.microsoft\.com|dl\.google\.com' \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ git ca-certificates
      - name: Build with TSan
        run: |
          cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread \
            -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread
          cmake --build build-tsan -j
      - name: Run C++ suites under TSan (python excluded — ctypes dlopen)
        run: TSAN_OPTIONS=halt_on_error=1:allocator_may_return_null=1 ctest --test-dir build-tsan -E python_plugin --output-on-failure

  rdma-compile:
    name: RDMA build (compile-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install deps incl. RDMA dev
        run: |
          # Drop preinstalled third-party apt sources (google-chrome, microsoft):
          # their mirrors intermittently break `apt-get update` (size mismatch
          # "Mirror sync in progress", or 403/"no longer signed" on the azure-cli
          # repo), which has nothing to do with our deps (all from the Ubuntu
          # archive). Match by content, not filename: the offending source lives
          # in different files across runner images (microsoft-prod.list,
          # azure-cli.list, *.sources, ...), so a fixed rm list misses some.
          sudo grep -rlE 'packages\.microsoft\.com|dl\.google\.com' \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ git ca-certificates libibverbs-dev
      - name: Configure + build with DFKV_WITH_RDMA=ON (no device at runtime)
        run: |
          cmake -S . -B build-rdma -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DDFKV_WITH_RDMA=ON -DDFKV_BUILD_TESTS=OFF
          cmake --build build-rdma -j
      - name: Verify ibverbs linked
        run: ldd build-rdma/dfkv_server | grep ibverbs

  rdma-loopback:
    name: RDMA datapath (Soft-RoCE loopback + TSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install deps incl. RDMA dev + tools
        run: |
          # Drop preinstalled third-party apt sources (google-chrome, microsoft):
          # their mirrors intermittently break `apt-get update` (size mismatch
          # "Mirror sync in progress", or 403/"no longer signed" on the azure-cli
          # repo), which has nothing to do with our deps (all from the Ubuntu
          # archive). Match by content, not filename: the offending source lives
          # in different files across runner images (microsoft-prod.list,
          # azure-cli.list, *.sources, ...), so a fixed rm list misses some.
          sudo grep -rlE 'packages\.microsoft\.com|dl\.google\.com' \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ git ca-certificates \
            libibverbs-dev rdma-core iproute2
      - name: Set up Soft-RoCE (rdma_rxe) over loopback
        run: |
          # rxe over 'lo' keeps packets in-host, so RC self-loopback actually
          # works in CI (rxe over a physical NIC relies on the network hairpinning
          # packets back, which GitHub runners don't do).
          sudo modprobe rdma_rxe || true
          sudo rdma link add rxe0 type rxe netdev lo || true
          rdma link show || true
      - name: Build (RDMA + tests)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDFKV_WITH_RDMA=ON
          cmake --build build -j --target rdma_loopback_test
      # Probe-then-gate: blanket continue-on-error masked real assertion failures
      # for weeks (two broken tests stayed green). Instead, first check that rxe
      # can actually round-trip RC traffic with the simplest datapath case; only
      # an env-level probe failure is tolerated. Once the probe passes, the full
      # suite is a hard gate.
      - name: Probe rxe loopback connectivity
        id: rxe_probe
        run: |
          ulimit -l unlimited 2>/dev/null || true
          if ./build/rdma_loopback_test --gtest_filter=RdmaLoopback.PutGetExistMissOverRdma; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::rxe loopback cannot round-trip RC traffic on this runner; datapath suite skipped"
          fi
      - name: Run RDMA datapath test (hard gate when rxe works)
        if: steps.rxe_probe.outputs.ok == 'true'
        run: |
          ulimit -l unlimited 2>/dev/null || true
          ./build/rdma_loopback_test
      - name: Build + run RDMA datapath test under ThreadSanitizer (hard gate when rxe works)
        if: steps.rxe_probe.outputs.ok == 'true'
        run: |
          cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DDFKV_WITH_RDMA=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread \
            -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread
          cmake --build build-tsan -j --target rdma_loopback_test
          ulimit -l unlimited 2>/dev/null || true
          TSAN_OPTIONS=halt_on_error=1 ./build-tsan/rdma_loopback_test

  portable-static-build:
    name: portable static artifacts
    runs-on: ubuntu-latest
    # Build inside ubuntu:22.04 (glibc 2.35) so the dynamically-linked artifacts
    # have a low glibc floor and run on any node with glibc >= 2.35. Building on
    # the runner's ubuntu-latest (glibc 2.39) bakes in GLIBC_2.3x symbols that
    # FAIL on older deploy nodes. RDMA-enabled + static libstdc++/libgcc;
    # libibverbs stays dynamic (it dlopen()s provider drivers at runtime).
    container: m.daocloud.io/docker.io/library/ubuntu@sha256:3b06811b2afd352be909dd088a004166d665dc76d38b13eada33522a9d915c6f # 22.04
    steps:
      # Bare container: install the toolchain (incl. git, for checkout) first.
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build g++ binutils git ca-certificates libibverbs-dev \
            liburing-dev python3 python3-pip python3-numpy xz-utils tar
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build portable RDMA artifacts (static libstdc++, no tests)
        run: |
          cmake -S . -B build-static -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DDFKV_BUILD_TESTS=OFF -DDFKV_WITH_RDMA=ON -DDFKV_WITH_URING=ON \
            -DDFKV_STATIC_LIBSTDCXX=ON
          cmake --build build-static -j
          strip build-static/dfkv_server build-static/dfkv_mds \
                build-static/dfkv_bench build-static/dfkv_smoke \
                build-static/dfkvctl build-static/dfkv_discover_smoke \
                build-static/dfkv_gpu_dedup_repro \
                build-static/libdfkv.so || true
      - name: Verify portability (glibc floor + RDMA linked + static libstdc++)
        run: |
          echo "== glibc floor (must be <= 2.35) =="
          objdump -T build-static/dfkv_server build-static/libdfkv.so \
            | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -3
          echo "== libdfkv.so deps (expect libibverbs, NOT libstdc++) =="
          ldd build-static/libdfkv.so
          if ldd build-static/libdfkv.so | grep -q 'libstdc++'; then
            echo 'ERROR: libstdc++ is not statically linked'; exit 1; fi
          if objdump -T build-static/dfkv_server build-static/libdfkv.so \
               | grep -qoE 'GLIBC_2\.(3[6-9]|[4-9][0-9])'; then
            echo 'ERROR: glibc floor exceeds 2.35'; exit 1; fi
      - name: Install, package, and verify exact release payload
        run: |
          set -eu
          V=$(cat VERSION)
          PKG="dfkv-${V}-linux-x86_64"

          # Exercise the supported system-prefix manifest independently.
          cmake --install build-static --prefix "$PWD/install-check/$PKG"

          # The canonical packager flattens share/dfkv into a self-contained
          # portable repository layout while preserving bin/lib/include.
          mkdir -p release unpack
          deploy/package_release.sh build-static release
          tar xzf "release/${PKG}.tar.gz" -C unpack
          ! tar -tzf "release/${PKG}.tar.gz" | grep -E '(__pycache__|\.py[co]$)'
          ROOT="$PWD/unpack/$PKG"

          for binary in dfkv_server dfkv_mds dfkv_bench dfkv_smoke dfkvctl \
                        dfkv_discover_smoke dfkv_gpu_dedup_repro; do
            test -x "$ROOT/bin/$binary"
            "$ROOT/bin/$binary" --version
          done
          test -f "$ROOT/lib/libdfkv.so"
          test -L "$ROOT/lib/libdfkv.so"
          test -L "$ROOT/lib/libdfkv.so.${V%%.*}"
          test "$(readlink "$ROOT/lib/libdfkv.so")" = "libdfkv.so.${V%%.*}"
          test "$(readlink "$ROOT/lib/libdfkv.so.${V%%.*}")" = "libdfkv.so.$V"
          test -f "$ROOT/python/dfkv_hicache.py"
          test -f "$ROOT/python/dfkv_common/client_metrics.py"
          test -f "$ROOT/python/dfkv_telemetry/metrics_push.py"
          test -f "$ROOT/deploy/dfkv_load_regression.py"
          test -f "$ROOT/deploy/dfkv_membership_audit.py"
          test -f "$ROOT/deploy/observability/docker-compose.yml"
          test -f "$ROOT/deploy/observability/alerts.yml"
          test -f "$ROOT/docs/METRICS.md"
          test -f "$ROOT/src/cache/dfkv_server_main.cc"
          test -f "$ROOT/integration/common/pyproject.toml"
          test -f "$ROOT/test/python/test_dfkv_operational_tools.py"
          test -f "$ROOT/Makefile"
          test -f "$ROOT/Dockerfile"
          test -f "$ROOT/.dockerignore"
          test -f "$ROOT/.github/workflows/ci.yml"
          test -f "$ROOT/.github/workflows/release.yml"

          PYTHONPYCACHEPREFIX="$PWD/pycache" python3 -m compileall -q \
            "$ROOT/python" "$ROOT/deploy" "$ROOT/integration"
          PYTHONPYCACHEPREFIX="$PWD/pycache" PYTHONPATH="$ROOT/python:$ROOT/test/python" python3 - <<'PY'
          import dfkv_common
          import dfkv_hicache
          import dfkv_hot_config
          import dfkv_metrics
          import dfkv_telemetry
          PY

          cp "release/${PKG}.tar.gz" .
          sha256sum "${PKG}.tar.gz" | tee "${PKG}.tar.gz.sha256"
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dfkv-linux-x86_64
          path: |
            dfkv-*-linux-x86_64.tar.gz
            dfkv-*-linux-x86_64.tar.gz.sha256


  python-wheels:
    name: connector wheels
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build and verify connector wheels
        run: |
          set -eu
          V=$(cat VERSION)
          mkdir -p wheels
          python -m pip wheel --no-deps --wheel-dir wheels integration/common
          python -m pip wheel --no-deps --wheel-dir wheels integration/lmcache
          python -m pip wheel --no-deps --wheel-dir wheels integration/vllm
          test -f "wheels/dfkv_common-${V}-py3-none-any.whl"
          test -f "wheels/dfkv_connector-${V}-py3-none-any.whl"
          test -f "wheels/dfkv_vllm-${V}-py3-none-any.whl"
          python -m pip install --no-deps --target wheel-check wheels/*.whl
          PYTHONPATH=wheel-check python - <<'PY'
          from importlib import metadata
          expected = {
              "dfkv-common": "dfkv_common/client_metrics.py",
              "dfkv-connector": "dfkv_connector/_telemetry/metrics_push.py",
              "dfkv-vllm": "dfkv_vllm/_telemetry/metrics_push.py",
          }
          version = open("VERSION", encoding="utf-8").read().strip()
          for distribution, required_file in expected.items():
              assert metadata.version(distribution) == version
              packaged = {str(path) for path in metadata.files(distribution) or ()}
              assert required_file in packaged, (distribution, required_file)
          import dfkv_common
          import dfkv_vllm
          import dfkv_vllm._telemetry.metrics_push
          PY
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dfkv-connector-wheels
          path: wheels/*.whl