# OpenTelemetry Collector receives connector metrics and traces over OTLP.
# Metrics become a Prometheus scrape endpoint; traces flow to Tempo. The small,
# long-lived C++ server/MDS fleet remains direct Prometheus pull.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  batch: {}

exporters:
  # Connector identity (connector_id/type/host/pid/tp_rank) rides on OTLP
  # *resource* attributes; resource_to_telemetry_conversion copies them onto each
  # series as labels so the dashboard can group/filter by connector. Metric names
  # are passed through verbatim (add_metric_suffixes:false) so they match the
  # instrument names the connectors emit (dfkv_connector_*).
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
    add_metric_suffixes: false
    enable_open_metrics: true
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: basic
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
