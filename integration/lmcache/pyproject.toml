[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dfkv-connector"
version = "2.39.0"
description = "LMCache RemoteConnector for the dfkv KV cache (ctypes over libdfkv.so)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Wine93", email = "wine93.info@gmail.com" }]
# Pure-python wheel: dfkv is reached through libdfkv.so via ctypes, loaded at
# runtime by path (DFKV_LIB / remote_storage_plugin.dfkv.lib). No bundled .so,
# no CPython extension, so the wheel is platform-independent.
dependencies = [
  "dfkv-common==2.39.0",
  # Checked against LMCache's L2AdapterInterface of 0.4.7-0.5.6. 0.5.7 adds
  # an abstract method the L2 adapter does not implement and moves
  # lmcache.v1.storage_backend to lmcache.inprocess.v1.storage_backend, so the
  # in-process connector fails to import there too. The in-process connector
  # also runs on 0.4.5; the L2 adapter needs 0.4.7.
  "lmcache>=0.4.5,<0.5.7",
  "torch",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]
# Opt-in telemetry (OTLP push); zero-cost no-op when unset / not installed.
otel = ["opentelemetry-sdk==1.41.1", "opentelemetry-exporter-otlp==1.41.1"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "integration: tests requiring a live dfkv mds + cache cluster",
]
