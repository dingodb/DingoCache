[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dfkv-connector"
version = "2.24.2"
description = "LMCache RemoteConnector for the dfkv KV cache (ctypes over libdfkv.so)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Wine93", email = "wine93.info@gmail.com" }]
# Pure-python wheel: dfkv is reached through libdfkv.so via ctypes, loaded at
# runtime by path (DFKV_LIB / remote_storage_plugin.dfkv.lib). No bundled .so,
# no CPython extension, so the wheel is platform-independent.
dependencies = [
  "dfkv-common==2.24.2",
  "lmcache",
  "torch",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]
# Opt-in telemetry (OTLP push); zero-cost no-op when unset / not installed.
otel = ["opentelemetry-sdk==1.41.1", "opentelemetry-exporter-otlp==1.41.1"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "integration: tests requiring a live dfkv mds + cache cluster",
]
